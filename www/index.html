<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buddy</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
  {
    "imports": {
      "three":          "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/":  "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>Buddy</h1>
    <div id="connection" class="pill pill-warn">connecting…</div>
  </header>

  <main>
    <section class="card full">
      <div class="card-head">
        <h2>3D Viewer</h2>
      </div>
      <div id="viewer"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Joints</h2>
        <button id="torque" class="btn">torque: ?</button>
      </div>
      <div id="joints" class="joint-grid"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Gripper</h2>
      </div>
      <div class="gripper-row">
        <button id="grip-open" class="btn">Open</button>
        <button id="grip-close" class="btn">Close</button>
      </div>
    </section>

    <section class="card full">
      <div class="card-head">
        <h2>Pose target</h2>
        <span id="pose-status" class="pill">—</span>
      </div>
      <div class="pose-grid">
        <label>x (mm)<input id="pose-x" type="number" step="1" value="0"></label>
        <label>y (mm)<input id="pose-y" type="number" step="1" value="0"></label>
        <label>z (mm)<input id="pose-z" type="number" step="1" value="390"></label>
        <label>roll<input  id="pose-roll"  type="number" step="1" value="0"></label>
        <label>pitch<input id="pose-pitch" type="number" step="1" value="0"></label>
        <label>yaw<input   id="pose-yaw"   type="number" step="1" placeholder="auto"></label>
      </div>
      <div class="pose-row">
        <label class="cb"><input type="checkbox" id="pose-elbow-up"> elbow up</label>
        <label>duration (ms)<input id="pose-duration" type="number" step="50" value="1500"></label>
        <button id="pose-preview" class="btn">Preview</button>
        <button id="pose-go" class="btn primary">Go</button>
      </div>
      <pre id="pose-preview-out">—</pre>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Status</h2>
      </div>
      <pre id="status-log">—</pre>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Console</h2>
      </div>
      <input id="cli-input" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false"
             placeholder="type a command (move, pose, torque, gripper, status, home)">
      <pre id="cli-log"></pre>
    </section>
  </main>

  <script type="module" src="/viewer.js"></script>
  <script src="/app.js"></script>
  <script src="/cli.js"></script>
  <script src="/pose.js"></script>
</body>
</html>
